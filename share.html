<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared list · Koti</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F8F6">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<style>
  body{min-height:100%}
  .sh{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 40px}
  .sh h1{font:700 32px/1.08 var(--display);letter-spacing:-.025em;margin:6px 0 2px}
  .sh .sub{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px}
  .live{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;animation:pulse 2s ease-in-out infinite}
  .sh .row.item{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .sh .row.item .nm{flex:1;min-width:0}.sh .row.item small{display:block;color:var(--muted);font-size:12.5px}
  .sh .row.item.done .nm{color:var(--muted);text-decoration:line-through}
  .foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
  .foot a{color:var(--spruce);font-weight:600}
  .gone{text-align:center;padding:60px 10px;color:var(--ink-2)}
  .own{margin-top:22px;background:#2442D6;color:#fff;border-radius:24px;padding:18px;display:grid;gap:12px}
  .own-h{display:flex;gap:14px;align-items:center}.own h2{font:800 28px/1 var(--display);font-stretch:62%;margin:0}.own p{margin:2px 0 0;font-size:14px;opacity:.9}
  .own-i{width:48px;height:48px;border-radius:14px;background:#fff;color:#2442D6;display:grid;place-items:center;flex:none}
  .own-b{display:flex;gap:8px}.own-go{flex:1;display:grid;place-items:center;min-height:48px;border-radius:999px;background:#fff;color:#15161A;font-weight:700}
  .own-later{min-height:48px;padding:0 16px;color:#fff;font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<main class="sh" id="sh" aria-live="polite"><p class="sub">Loading the list…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase-2.117.3.js"></script>
<script src="js/share.js"></script>
</body>
</html>
