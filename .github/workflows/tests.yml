name: Tests

# Koti's own modules run in Node against a pretend server with the database's rules: sync, money, bills,
# paydays and accounts. No secrets, no network.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
