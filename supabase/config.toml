# Supabase CLI project settings. The hosted project is linked in CI with SUPABASE_PROJECT_REF.
project_id = "koti"

[db]
major_version = 17

[functions.read-receipt]
# The function checks the signed-in user itself (works with publishable/secret API keys).
verify_jwt = false

[functions.send-reminders]
# Called hourly by pg_cron with a token kept in Vault, or by a signed-in user (checked inside).
verify_jwt = false

[functions.hear]
# Speech and typed phrases from the add box. The function checks the signed-in user itself.
verify_jwt = false
